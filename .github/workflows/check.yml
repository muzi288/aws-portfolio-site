name: Check portfolio

on:
  pull_request:
    paths: ["site/**", "scripts/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["site/**", "scripts/**", ".github/workflows/check.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-site.mjs
